name: Deploy to InfinityFree

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FTP_HOST: ftpupload.net
  DEPLOY_ROOT: /htdocs
  INITIAL_PRODUCTION_BASELINE_SHA: f141d351bf67167fd44fb7d9f0ee11ead4e3518e

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate deployment credentials
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::Missing INFINITYFREE_FTP_USERNAME or INFINITYFREE_FTP_PASSWORD repository secret."
            exit 1
          fi

      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Install resilient FTP client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Resolve last deployed revision
        id: baseline
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          rm -f .remote-deploy-state

          set +e
          curl             --silent             --show-error             --fail             --retry 2             --retry-all-errors             --connect-timeout 15             --max-time 45             --ssl-reqd             --user "$FTP_USERNAME:$FTP_PASSWORD"             "ftp://$FTP_HOST$DEPLOY_ROOT/.masarak-deploy-state"             --output .remote-deploy-state
          state_status=$?
          set -e

          baseline="$INITIAL_PRODUCTION_BASELINE_SHA"

          if [[ $state_status -eq 0 && -s .remote-deploy-state ]]; then
            candidate="$(tr -d '\r\n ' < .remote-deploy-state)"
            if [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]               && git cat-file -e "$candidate^{commit}" 2>/dev/null               && git merge-base --is-ancestor "$candidate" HEAD; then
              baseline="$candidate"
              echo "Using remote deployment state: $baseline"
            else
              echo "::warning::Remote deployment state is invalid or is not an ancestor of HEAD. Falling back to the known production baseline."
            fi
          else
            echo "::notice::No readable deployment state found yet. Using the known production baseline."
          fi

          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare incremental deployment payload
        env:
          DEPLOY_BASELINE: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          export DEPLOY_HEAD="$(git rev-parse HEAD)"
          python3 .github/scripts/prepare_infinityfree_deploy.py

      - name: Prepare one-time assessment v1.3 production runner
        id: assessment_v13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy/database/seeders .deploy/public
          cp database/seeders/AssessmentQuestionBankV13Seeder.php .deploy/database/seeders/AssessmentQuestionBankV13Seeder.php

          token="$(openssl rand -hex 32)"
          runner="assessment-v13-$(openssl rand -hex 12).php"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

          cat > ".deploy/public/$runner" <<'PHP'
          <?php
          declare(strict_types=1);

          header('Content-Type: application/json; charset=utf-8');

          $expected = '__ASSESSMENT_V13_TOKEN__';
          $provided = $_SERVER['HTTP_X_MASARAK_DEPLOY_TOKEN'] ?? '';
          if (! is_string($provided) || ! hash_equals($expected, $provided)) {
              http_response_code(404);
              echo json_encode(['ok' => false]);
              exit;
          }

          require __DIR__.'/../vendor/autoload.php';
          $app = require __DIR__.'/../bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          try {
              $exitCode = $kernel->call('db:seed', [
                  '--class' => 'Database\\Seeders\\AssessmentQuestionBankV13Seeder',
                  '--force' => true,
              ]);

              $active = App\Models\AssessmentVersion::query()
                  ->where('version_number', 13)
                  ->where('status', 'active')
                  ->whereNotNull('published_at')
                  ->exists();

              if ($exitCode !== 0 || ! $active) {
                  throw new RuntimeException('Assessment v1.3 verification failed.');
              }

              echo json_encode(['ok' => true, 'version' => 13]);
          } catch (Throwable $e) {
              report($e);
              http_response_code(500);
              echo json_encode(['ok' => false]);
          }
          PHP

          sed -i "s/__ASSESSMENT_V13_TOKEN__/$token/" ".deploy/public/$runner"

      - name: Validate deployment payload
        shell: bash
        run: |
          test -f .deploy/.htaccess
          test -f public/build/manifest.json
          test -f public/.htaccess
          test -f public/index.php
          test ! -e .deploy/.env

          oversized="$(find .deploy -type f -name '*.php' -size +1024k -print)"
          if [[ -n "$oversized" ]]; then
            echo "::error::PHP files larger than 1 MiB were found in the deployment payload:"
            echo "$oversized"
            exit 1
          fi

          if grep -RIl --exclude='.htaccess' -E '^(APP_KEY|DB_PASSWORD)=' .deploy 2>/dev/null | grep -q .; then
            echo "::error::A production secret-like environment entry was detected in the deployment payload."
            exit 1
          fi

      - name: Upload incremental payload
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          deploy_payload() {
            local protect_data="$1"

            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data $protect_data
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set net:max-retries 8
          set net:timeout 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set xfer:clobber yes
          mirror --reverse --verbose=1 --parallel=1 --no-perms .deploy/ $DEPLOY_ROOT/
          bye
          LFTP
          }

          transfer_mode=""

          for attempt in 1 2; do
            echo "Encrypted-data FTPS attempt $attempt/2"
            if deploy_payload yes; then
              transfer_mode="yes"
              break
            fi
            sleep 10
          done

          if [[ -z "$transfer_mode" ]]; then
            echo "::warning::InfinityFree closed the fully encrypted FTP data channel. Retrying with TLS kept on the control/login channel and clear transfer data. The payload contains public application code only; production secrets are excluded."
            for attempt in 1 3; do
              echo "TLS-control fallback attempt $attempt/3"
              if deploy_payload no; then
                transfer_mode="no"
                break
              fi
              sleep 10
            done
          fi

          if [[ -z "$transfer_mode" ]]; then
            echo "::error::Unable to upload the incremental payload after all retry modes."
            exit 1
          fi

          echo "$transfer_mode" > .ftp-transfer-mode

      - name: Publish assessment v1.3 on production and remove runner
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          ASSESSMENT_V13_TOKEN: ${{ steps.assessment_v13.outputs.token }}
          ASSESSMENT_V13_RUNNER: ${{ steps.assessment_v13.outputs.runner }}
        shell: bash
        run: |
          set -euo pipefail

          set +e
          response="$(curl --silent --show-error --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -H "X-Masarak-Deploy-Token: $ASSESSMENT_V13_TOKEN" \
            "https://masarak.42web.io/$ASSESSMENT_V13_RUNNER")"
          seed_status=$?
          set -e

          protect_data="$(cat .ftp-transfer-mode)"
          cleanup_runner() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data $protect_data
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          rm -f "$DEPLOY_ROOT/public/$ASSESSMENT_V13_RUNNER"
          bye
          LFTP
          }

          cleanup_runner

          if [[ $seed_status -ne 0 ]] || [[ "$response" != *'"ok":true'* ]]; then
            echo "::error::Assessment v1.3 production publication failed."
            exit 1
          fi

          echo "Assessment v1.3 published successfully and one-time runner removed."

      - name: Apply deletions and commit deployment state
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          DEPLOY_HEAD="$(git rev-parse HEAD)"
          printf '%s\n' "$DEPLOY_HEAD" > .current-deploy-state
          protect_data="$(cat .ftp-transfer-mode)"

          finalize_deploy() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data $protect_data
          set ftp:passive-mode yes
          set ssl:verify-certificate yes
          set net:max-retries 8
          set net:timeout 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          source .deploy-deletions.lftp
          put .current-deploy-state -o $DEPLOY_ROOT/.masarak-deploy-state
          bye
          LFTP
          }

          for attempt in 1 3; do
            if finalize_deploy; then
              echo "Deployment state committed at $DEPLOY_HEAD"
              exit 0
            fi
            echo "Finalize attempt $attempt/3 failed; retrying."
            sleep 10
          done

          echo "::error::Files were uploaded, but deployment state could not be committed."
          exit 1
