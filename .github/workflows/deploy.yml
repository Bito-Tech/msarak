name: Deploy to InfinityFree

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::InfinityFree deployment skipped: configure INFINITYFREE_FTP_USERNAME and INFINITYFREE_FTP_PASSWORD repository secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested revision
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Setup PHP
        if: steps.credentials.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install production PHP dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend
        if: steps.credentials.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare InfinityFree web root
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          cat > .htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteRule (.*) /public/$1 [L]
          HTACCESS

          test -f vendor/autoload.php
          test -f public/build/manifest.json
          test -f public/.htaccess
          test -f public/index.php
          test ! -f .env

      - name: Enforce InfinityFree PHP file-size limit
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          oversized="$(find . -path './node_modules' -prune -o -type f -name '*.php' -size +1024k -print)"
          if [[ -n "$oversized" ]]; then
            echo "::error::PHP files larger than 1 MiB were found:"
            echo "$oversized"
            exit 1
          fi

      - name: Deploy changed files over FTPS
        if: steps.credentials.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 120000
          local-dir: ./
          server-dir: /htdocs/
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            tests/**
            docs/**
            scripts/**
            **/.env*
            **/.phpunit*
            **/*.bundle
            README.md
            AI_Log.md
            package.json
            package-lock.json
            vite.config.js
            resources/css/**
            resources/js/**
            database/**
            storage/app/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            public/hot
